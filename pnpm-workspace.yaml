packages:
  - "apps/*"
  - "packages/*"

overrides:
  svelte: "5.57.1"
  brace-expansion: "5.0.12"
  deepmerge-ts: "8.0.2"
  devalue: "5.9.4"
  fast-uri: "3.1.9"
  mysql2: "3.23.1"
  nanoid: "3.3.18"
  postcss: "8.5.25"
  source-map-js: "1.2.2"
  tar: "7.5.22"
  undici: "7.30.1"
  zod: "4.6.7"

onlyBuiltDependencies:
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - esbuild
  - lefthook
  - prisma
  - sharp

auditConfig:
  ignoreGhsas:
    # deepmerge has no fixed release. Only vite-plugin-svelte uses it, to merge build config the repo writes itself.
    - GHSA-gcqx-w48m-w2h4
